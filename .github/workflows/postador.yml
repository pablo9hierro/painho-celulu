name: Postador automático

# Cron ÚNICO do Postador (estatística + aprendizado + postagem), a cada 30 min.
# Cada rodada lê os acessos do site e o desempenho do Instagram (alimenta o
# aprendizado) e SÓ posta se for ~25 min antes de um pico de audiência
# (horários calculados pelos próprios dados; veja autopost-dados/relatorio.json).
#
# Liga/desliga: variável do repositório AUTOPOST_ATIVO = 1 (sem ela, roda em
# ensaio e não publica nada). Senhas e tokens: Settings > Secrets > Actions.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Postar agora (ignora o horário)'
        type: boolean
        default: false

permissions:
  contents: write

# nunca duas rodadas ao mesmo tempo (evita post duplicado)
concurrency:
  group: postador
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Dados do aprendizado (branch autopost-dados)
        run: |
          git config user.name "postador-bot"
          git config user.email "postador-bot@users.noreply.github.com"
          if git fetch --depth 1 origin autopost-dados; then
            git worktree add autopost-dados FETCH_HEAD
          else
            mkdir -p autopost-dados
          fi

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npx playwright install --with-deps chromium

      - name: Subir a interface (motor do vídeo)
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 2; done

      - name: Rodada do Postador
        env:
          AUTOPOST_ATIVO: ${{ vars.AUTOPOST_ATIVO }}
          AUTOPOST_MAX_DIA: ${{ vars.AUTOPOST_MAX_DIA }}
          AUTOPOST_SITE_PUBLICAR: ${{ vars.AUTOPOST_SITE_PUBLICAR }}
          AUTOPOST_FORCAR: ${{ inputs.forcar && '1' || '' }}
          AUTOPOST_DADOS: autopost-dados
          AUTOPOST_APP_URL: http://localhost:5173/
          WEBSG_URL: ${{ secrets.WEBSG_URL }}
          WEBSG_USER: ${{ secrets.WEBSG_USER }}
          WEBSG_PASS: ${{ secrets.WEBSG_PASS }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_FB_TOKEN: ${{ secrets.INSTAGRAM_FB_TOKEN }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          AUTOPOST_CHAVE: ${{ secrets.AUTOPOST_CHAVE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: npm run autopost

      - name: Guardar o vídeo da rodada (3 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: autopost-dados/videos/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Salvar o aprendizado
        if: always()
        run: |
          cd autopost-dados
          rm -rf videos
          [ -f estado.json ] || exit 0
          if [ ! -d .git ] && [ ! -f .git ]; then
            git init -q -b autopost-dados
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git add -A
          git -c user.name="postador-bot" -c user.email="postador-bot@users.noreply.github.com" commit -qm "Postador: rodada ${{ github.run_id }}" || exit 0
          # o app pode ter enviado tons nesse meio tempo: junta antes de salvar
          git pull -q --rebase origin autopost-dados || true
          git push -q origin HEAD:autopost-dados
